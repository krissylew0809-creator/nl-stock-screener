<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>自然语言选股与策略解释器</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1d2330;--mut:#667085;--line:#e4e7ec;--pri:#2457d6;--ok:#127a48;--okbg:#e6f6ee;--bad:#b42318;--badbg:#fdecea;--warn:#8a5a00;--warnbg:#fff4d6}
@media(prefers-color-scheme:dark){:root{--bg:#0f131a;--card:#171c26;--ink:#e6e9ef;--mut:#98a2b3;--line:#2a3140;--pri:#7aa2ff;--ok:#5fd19a;--okbg:#12281d;--bad:#ff8a80;--badbg:#31181a;--warn:#ffcf70;--warnbg:#33290f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
main{max-width:1080px;margin:0 auto;padding:16px}h1{font-size:20px;margin:4px 0 2px}h2{font-size:15px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:12px 0}
.sub{color:var(--mut);font-size:12.5px}.banner{padding:8px 12px;border-radius:8px;margin:6px 0;font-size:13px}
.b-warn{background:var(--warnbg);color:var(--warn)}.b-bad{background:var(--badbg);color:var(--bad)}.b-ok{background:var(--okbg);color:var(--ok)}
textarea,input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
textarea{width:100%;min-height:64px}button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:6px 12px}
button.pri{background:var(--pri);border-color:var(--pri);color:#fff}button:disabled{opacity:.5;cursor:default}
.chips button{margin:4px 6px 0 0;font-size:12.5px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mut);font-weight:500;font-size:12.5px}
.tag{display:inline-block;padding:0 7px;border-radius:10px;font-size:12px}.t-pass{background:var(--okbg);color:var(--ok)}.t-fail{background:var(--badbg);color:var(--bad)}.t-missing{background:var(--warnbg);color:var(--warn)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.stock{border:1px solid var(--line);border-radius:8px;margin:6px 0}.stock>summary{cursor:pointer;padding:8px 10px;list-style:none;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stock .body{padding:4px 10px 10px}.num{font-variant-numeric:tabular-nums}.opt{padding:6px 0}.opt label{display:block}
.disc{font-size:12px;color:var(--mut);margin-top:20px;padding-bottom:30px}svg{max-width:100%}.mono{font-family:ui-monospace,monospace;font-size:12px}
@media(max-width:640px){th:nth-child(4),td:nth-child(4){display:none}}
</style></head><body><main>
<h1>自然语言选股与策略解释器</h1>
<div class="sub">AI 负责把模糊意图翻译成条件 · 确定性引擎负责筛选 · 金融数据接口负责提供数据。每个结论都能回溯到字段、时点与口径。</div>
<div id="modeBanner"></div>

<section class="card"><h2>① 说出你的选股意图</h2>
<textarea id="q" placeholder="例如：经营改善、估值合理、走势相对稳定">经营改善、估值合理、走势相对稳定</textarea>
<div class="chips" id="examples"></div>
<div class="row" style="margin-top:8px"><button class="pri" id="btnParse">解析为数据条件</button><span class="sub" id="parseInfo"></span></div>
<div id="compliance"></div></section>

<section class="card" id="condCard" hidden><h2>② 检查并修改条件</h2>
<div id="clar"></div><div id="conflicts"></div><div id="unmatched"></div>
<table><thead><tr><th>启用</th><th>指标</th><th>条件</th><th>来源词</th><th>数据口径</th><th></th></tr></thead><tbody id="condRows"></tbody></table>
<div class="row" style="margin-top:8px"><button id="btnAdd">＋ 添加自定义条件</button>
<label>数据缺失时：<select id="policy"><option value="exclude">不入选，单独列为“待定”（默认，保守）</option><option value="include">忽略缺失条件，标注“数据不完整”后入选</option></select></label>
<button class="pri" id="btnRun">运行筛选</button></div></section>

<section class="card" id="resCard" hidden><h2>③ 结果与解释</h2><div id="status"></div><div id="summary"></div>
<div class="row tabs" id="tabs" style="margin:8px 0"></div><div id="list"></div>
<div class="row" id="actions" style="margin-top:10px"></div></section>

<section class="card" id="sensCard" hidden><h2>④ 条件变化会带来什么影响</h2><div id="sens"></div></section>
<section class="card" id="toolCard" hidden><h2>⑤ 比较 / 历史回看</h2><div id="tool"></div></section>
<section class="card"><h2>已保存的筛选与监控任务</h2><div id="saved" class="sub">加载中…</div></section>
<div class="disc" id="disc"></div>
</main>
<script src="app.js"></script></body></html>
